# Build Storybook แล้วเผยแพร่ผ่าน GitLab Pages ทุกครั้งที่ push เข้า branch หลัก
# ลิงก์ดูได้ที่ Deploy > Pages ของโปรเจกต์

image: node:22

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

pages:
  stage: deploy
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build-storybook
    - rm -rf public
    - mv storybook-static public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
